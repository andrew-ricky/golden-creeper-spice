<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Golden Creeper</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin sub-header navigation */
    .admin-sub-header {
      background: var(--dark, #1b4332);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.8rem 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .admin-sub-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-tabs { 
      display: flex; 
      gap: 1rem; 
    }
    .tab-btn { 
      background: rgba(255,255,255,0.1); 
      border: none; 
      font-size: 0.95rem; 
      font-weight: 700; 
      color: #fff; 
      cursor: pointer; 
      padding: 0.5rem 1.2rem; 
      border-radius: 6px; 
      transition: 0.3s; 
    }
    .tab-btn.active { 
      background: #ffffff; 
      color: var(--primary, #2d6a4f); 
    }

    .admin-container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .order-table, .product-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 1rem; }
    .order-table th, .order-table td, .product-table th, .product-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .order-table th, .product-table th { background: var(--primary); color: white; }
    .status-select { padding: 0.4rem; border-radius: 5px; border: 1px solid #ccc; font-weight: 600; }
    
    .form-box { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; }
    .btn-primary { background: var(--primary); color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-edit { background: #f59e0b; color: white; padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; margin-right: 0.3rem; }
  </style>
</head>
<body>

  <!-- Main Header -->
  <header>
    <div class="header-container">
      <div class="logo">🌿 Admin Dashboard</div>
      <nav>
        <a href="#" onclick="adminLogout()" style="color: #ff4d4d; font-weight: 700;"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
  </header>

  <!-- Admin Sub Navigation Header -->
  <div class="admin-sub-header">
    <div class="admin-sub-container">
      <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('orders')"><i class="fas fa-box"></i> Manage Orders</button>
        <button class="tab-btn" onclick="switchTab('products')"><i class="fas fa-tags"></i> Manage Products</button>
      </div>
      <span style="color: #cbd5e1; font-size: 0.85rem;"><i class="fas fa-user-shield"></i> Administrator</span>
    </div>
  </div>

  <div class="admin-container">
    <!-- TAB 1: Manage Orders -->
    <div id="orders-tab" class="tab-content active">
      <h2 style="color: var(--primary);">Customer Orders</h2>
      <div id="admin-orders-list">Loading orders...</div>
    </div>

    <!-- TAB 2: Manage Products -->
    <div id="products-tab" class="tab-content">
      <h2 style="color: var(--primary);">Add / Edit Products</h2>
      
      <!-- Product Form -->
      <div class="form-box">
        <h3 id="form-title" style="margin-bottom: 1rem; color: var(--primary);">Add New Product</h3>
        <form id="product-form">
          <input type="hidden" id="product-id">
          <div class="form-grid">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="p-name" required placeholder="Enter product name">
            </div>
            <div class="form-group">
              <label>Price ($)</label>
              <input type="number" step="0.01" id="p-price" required placeholder="Enter price">
            </div>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="p-image-url" required placeholder="Enter Supabase Image Public URL">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="p-desc" rows="3" placeholder="Enter product description"></textarea>
          </div>
          <button type="submit" class="btn-primary" id="save-product-btn">Add Product</button>
          <button type="button" id="cancel-edit-btn" onclick="resetProductForm()" style="display:none; background:#6b7280; color:white; padding:0.7rem 1.5rem; border:none; border-radius:6px; font-weight:700; cursor:pointer; margin-left:0.5rem;">Cancel</button>
        </form>
      </div>

      <h2 style="color: var(--primary);">Existing Products</h2>
      <div id="admin-products-list">Loading products...</div>
    </div>
  </div>

  <!-- Supabase CDN and Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session || session.user.email !== 'admin@gmail.com') {
        alert('Access Denied! Admins only.');
        window.location.href = 'login.html';
        return;
      }

      fetchAllOrders();
      fetchAllProducts();
    });

    // Switch between admin tabs
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'orders') {
        document.querySelector('.admin-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('orders-tab').classList.add('active');
        fetchAllOrders();
      } else {
        document.querySelector('.admin-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('products-tab').classList.add('active');
        fetchAllProducts();
      }
    }

    // Fetch orders function
    async function fetchAllOrders() {
      const container = document.getElementById('admin-orders-list');
      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color: red;">Error fetching orders: ${error.message}</p>`;
        return;
      }

      if (!orders || orders.length === 0) {
        container.innerHTML = `<p style="margin-top: 1rem; color: #666;">No orders found.</p>`;
        return;
      }

      let tableHtml = `
        <table class="order-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer Info</th>
              <th>Items</th>
              <th>Total ($)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
      `;

      orders.forEach(order => {
        let itemsStr = '';
        if (order.cart_items && Array.isArray(order.cart_items)) {
          order.cart_items.forEach(i => {
            itemsStr += `${i.name} (x${i.qty})<br>`;
          });
        }

        tableHtml += `
          <tr>
            <td>#${order.id}</td>
            <td><strong>${order.full_name}</strong><br>${order.address}, ${order.city}<br>${order.phone}</td>
            <td>${itemsStr}</td>
            <td>$${parseFloat(order.total_amount).toFixed(2)}</td>
            <td>
              <select class="status-select" onchange="updateOrderStatus(${order.id}, this.value)">
                <option value="Received" ${order.status === 'Received' ? 'selected' : ''}>Received</option>
                <option value="Packed" ${order.status === 'Packed' ? 'selected' : ''}>Packed</option>
                <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              </select>
            </td>
          </tr>
        `;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;
    }

    // Update order status
    async function updateOrderStatus(orderId, newStatus) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ status: newStatus })
        .eq('id', orderId);

      if (error) {
        alert('Failed to update status: ' + error.message);
      } else {
        alert('Order #' + orderId + ' status updated to ' + newStatus);
      }
    }

    // Fetch products for admin panel
    async function fetchAllProducts() {
      const container = document.getElementById('admin-products-list');
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        container.innerHTML = `<p style="color: red;">Error fetching products: ${error.message}</p>`;
        return;
      }

      if (!products || products.length === 0) {
        container.innerHTML = `<p style="margin-top: 1rem; color: #666;">No products found.</p>`;
        return;
      }

      let tableHtml = `
        <table class="product-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Price ($)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      products.forEach(p => {
        const safeName = (p.name || '').replace(/'/g, "\\'");
        const safeDesc = (p.description || '').replace(/'/g, "\\'");
        const safeImg = (p.image_url || '').replace(/'/g, "\\'");

        tableHtml += `
          <tr>
            <td>${p.id}</td>
            <td><img src="${p.image_url || ''}" alt="" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></td>
            <td><strong>${p.name}</strong></td>
            <td>$${parseFloat(p.price).toFixed(2)}</td>
            <td>
              <button class="btn-edit" onclick="editProduct(${p.id}, '${safeName}', ${p.price}, '${safeImg}', '${safeDesc}')">Edit</button>
              <button class="btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
            </td>
          </tr>
        `;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;
    }

    // Handle product form submission (Add/Update)
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('product-id').value;
      const name = document.getElementById('p-name').value;
      const price = parseFloat(document.getElementById('p-price').value);
      const imageUrl = document.getElementById('p-image-url').value;
      const description = document.getElementById('p-desc').value;

      if (id) {
        const { error } = await supabaseClient
          .from('products')
          .update({ 
            name: name, 
            price: price, 
            image_url: imageUrl, 
            description: description 
          })
          .eq('id', id);

        if (error) {
          alert('Error updating product: ' + error.message);
        } else {
          alert('Product updated successfully!');
          resetProductForm();
          fetchAllProducts();
        }
      } else {
        const { error } = await supabaseClient
          .from('products')
          .insert([{ 
            name: name, 
            price: price, 
            image_url: imageUrl, 
            description: description 
          }]);

        if (error) {
          alert('Error adding product: ' + error.message);
        } else {
          alert('Product added successfully!');
          resetProductForm();
          fetchAllProducts();
        }
      }
    });

    // Populate form for editing product
    function editProduct(id, name, price, imageUrl, description) {
      document.getElementById('product-id').value = id;
      document.getElementById('p-name').value = name;
      document.getElementById('p-price').value = price;
      document.getElementById('p-image-url').value = imageUrl;
      document.getElementById('p-desc').value = description;

      document.getElementById('form-title').innerText = 'Edit Product #' + id;
      document.getElementById('save-product-btn').innerText = 'Update Product';
      document.getElementById('cancel-edit-btn').style.display = 'inline-block';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reset product form state
    function resetProductForm() {
      document.getElementById('product-form').reset();
      document.getElementById('product-id').value = '';
      document.getElementById('form-title').innerText = 'Add New Product';
      document.getElementById('save-product-btn').innerText = 'Add Product';
      document.getElementById('cancel-edit-btn').style.display = 'none';
    }

    // Delete product
    async function deleteProduct(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) alert('Error deleting product: ' + error.message);
        else {
          alert('Product deleted successfully!');
          fetchAllProducts();
        }
      }
    }

    // Admin logout function
    async function adminLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
